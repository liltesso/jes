<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #060309;
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  #screen > div { animation: fadeInUp 0.28s ease; }
  @keyframes pulse { 0%,100% { opacity:0.5; } 50% { opacity:0.9; } }
  .skeleton-block { border-radius: 18px; background: rgba(255,255,255,0.06); animation: pulse 1.4s ease-in-out infinite; }

  #app {
    position: relative;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* фон с кольцами */
  .rings-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 140% 55% at 50% 0%, #2a1240 0%, #0a0510 55%, #060309 100%);
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .rings-bg .ring {
    position: absolute;
    top: 26%; left: 50%;
    border: 1px solid rgba(168,85,247,0.13);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .rings-bg .glow {
    position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(192,38,211,0.35), transparent 70%);
    filter: blur(10px);
  }

  /* Telegram header */
  .tg-header {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(17,17,22,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .tg-header .close { color: #4fa4f7; font-size: 15px; }
  .tg-header .title { text-align: center; line-height: 1.2; display:flex; align-items:center; gap:8px; justify-content:center; }
  .tg-header .title img { width:26px; height:26px; border-radius:8px; object-fit:cover; box-shadow:0 2px 8px rgba(192,38,211,0.5); }
  .tg-header .title .txt b { display: block; font-size: 15.5px; letter-spacing:0.03em; }
  .tg-header .title .txt span { display: block; font-size: 10.5px; color: rgba(255,255,255,0.4); letter-spacing:0.08em; text-transform:uppercase; }
  .tg-header .menu {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid rgba(192,38,211,0.5);
    display: flex; align-items: center; justify-content: center;
    color: #e879f9; font-size: 13px; font-weight: 700;
    background: rgba(192,38,211,0.08);
    cursor: pointer;
  }

  /* контент */
  #screen {
    position: relative; z-index: 1;
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  #screen::-webkit-scrollbar { display: none; }

  .px5 { padding-left: 20px; padding-right: 20px; }

  .section-title { padding: 8px 20px 16px; }
  .section-title h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .section-title p { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 4px; }

  .card {
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(0,0,0,0.35));
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }

  .btn {
    width: 100%; border: none; border-radius: 16px;
    padding: 15px; font-weight: 800; font-size: 15px;
    letter-spacing: 0.02em; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(90deg, #e6399b, #a13be0, #5b4bf0); color: #fff; box-shadow: 0 6px 20px rgba(161,59,224,0.35); }
  .btn-green { background: linear-gradient(90deg, #1fbf6b, #0e9e57); color: #fff; box-shadow: 0 6px 20px rgba(31,191,107,0.3); }
  .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; opacity: 0.5; }

  .stock-pill {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 999px; padding: 10px; font-size: 14px; font-weight: 600;
  }
  .stock-pill.in { background: #0d2b1c; border: 1px solid #1f5c3a; color: #34d67f; }
  .stock-pill.out { background: #2b0d0d; border: 1px solid #5c1f1f; color: #f87171; }
  .stock-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .badge {
    color: #fff; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .badge.new { background: linear-gradient(90deg, #c026d3, #7c3aed); }
  .badge.hit { background: linear-gradient(90deg, #f59e0b, #ea580c); }

  .stars { display: flex; align-items: center; gap: 2px; }
  .stars svg { fill: #fbbf24; }

  /* tabs */
  .tabbar {
    position: relative; z-index: 2;
    display: flex;
    background: rgba(17,17,22,0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: rgba(255,255,255,0.4);
    font-size: 10.5px; font-weight: 500; cursor: pointer; position: relative;
  }
  .tab.active { color: #fff; }
  .tab .icon-wrap { position: relative; }
  .tab.active .icon-wrap::before {
    content: ""; position: absolute; inset: -6px -14px;
    background: linear-gradient(135deg, rgba(192,38,211,0.25), rgba(124,58,237,0.2));
    border-radius: 14px; z-index: -1;
  }
  .tab .cart-badge {
    position: absolute; top: -6px; right: -8px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: linear-gradient(90deg, #c026d3, #7c3aed);
    color: #fff; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }


  input {
    font-family: inherit; color: #fff; background: transparent; border: none; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.3); }

  .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

  .card img {
    object-fit: contain !important;
    aspect-ratio: 16/9 !important;
    background: rgba(255,255,255,0.04);
  }
  #screen { position: relative; overflow-x: hidden; touch-action: pan-y; overscroll-behavior-x: none; }
  #screen.tab-transition-next { animation: screenSlideNext 240ms cubic-bezier(.22,.61,.36,1); }
  #screen.tab-transition-prev { animation: screenSlidePrev 240ms cubic-bezier(.22,.61,.36,1); }
  @keyframes screenSlideNext { 0% { opacity: .55; transform: translate3d(24px, 0, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
  @keyframes screenSlidePrev { 0% { opacity: .55; transform: translate3d(-24px, 0, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
  .btn, .tab, button { -webkit-user-select: none; user-select: none; will-change: transform; }
  .btn:active { transform: scale(.97); }
  .tab:active { transform: scale(.93); }
  .lang-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
  }
  .lang-btn:active {
    transform: scale(0.94);
    background: rgba(192,38,211,0.25);
  }

</style>

function t(key) {
  const lang = CURRENT_LANG || 'ru';
  if (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) return TRANSLATIONS[lang][key];
  if (TRANSLATIONS.ru && TRANSLATIONS.ru[key]) return TRANSLATIONS.ru[key];
  return key;
}

function toggleLang() {
  CURRENT_LANG = (CURRENT_LANG === 'ru' ? 'de' : 'ru');
  localStorage.setItem('lang', CURRENT_LANG);
  updateLangBtn();
  renderTabbar();
  render();
}

function updateLangBtn() {
  const btn = document.getElementById('langSwitchBtn');
  if (btn) btn.innerText = CURRENT_LANG === 'ru' ? '🇷🇺 RU' : '🇩🇪 DE';
  const offText = document.getElementById('offline-banner-text');
  if (offText) offText.innerText = t('offline_msg');
}

function haptic(type = 'light') {
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
      if (type === 'light') window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      else if (type === 'medium') window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
      else if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
    }
  } catch(e) {}
}

function sanitizeHTML(dirtyHTML) {
  if (!dirtyHTML) return '';
  const parser = new DOMParser();
  const doc = parser.parseFromString(dirtyHTML, 'text/html');
  const allowedTags = ['B', 'I', 'U', 'EM', 'STRONG', 'BR', 'P', 'UL', 'OL', 'LI', 'SPAN'];
  function cleanNode(node) {
    const children = node.childNodes;
    for (let i = children.length - 1; i >= 0; i--) {
      const child = children[i];
      if (child.nodeType === Node.ELEMENT_NODE) {
        if (!allowedTags.includes(child.nodeName)) {
          const safeText = document.createTextNode(child.textContent || '');
          child.parentNode.replaceChild(safeText, child);
          continue;
        }
        while (child.attributes.length > 0) {
          child.removeAttribute(child.attributes[0].name);
        }
        cleanNode(child);
      }
    }
  }
  cleanNode(doc.body);
  return doc.body.innerHTML;
}

function escapeHTML(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

window.BACKEND_URL = window.BACKEND_URL || '';

async function api(path, opts = {}) {
  const url = window.BACKEND_URL + path;
  opts.headers = opts.headers || {};
  opts.headers["Bypass-Tunnel-Reminder"] = "true";
  opts.headers["ngrok-skip-browser-warning"] = "true";
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
    opts.headers["X-Telegram-Init-Data"] = window.Telegram.WebApp.initData;
  }
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const GRAD_POOL = [
  "linear-gradient(135deg,#1c1140,#3a1060)", "linear-gradient(135deg,#2a0845,#7a1550)",
  "linear-gradient(135deg,#1a1030,#4a1550)", "linear-gradient(135deg,#20063a,#a13be0)",
  "linear-gradient(135deg,#0f0a2a,#3a1a7a)", "linear-gradient(135deg,#160a2e,#5b1a8a)",
];
function gradFor(id) { return GRAD_POOL[id % GRAD_POOL.length]; }

async function loadCatalog() {
  const [regular, liquids, catalogCats] = await Promise.all([
    api("/api/products?is_liquid=0"),
    api("/api/products?is_liquid=1"),
    api("/api/categories").catch(() => []),
  ]);
  PRODUCTS = [...regular, ...liquids];
  CATEGORY_LIST = catalogCats.map(c => c.name);
  // В фильтре показываем только те категории, в которых реально есть товары.
  const used = new Set(PRODUCTS.map(p => p.category).filter(Boolean));
  const ordered = CATEGORY_LIST.filter(name => used.has(name));
  for (const name of used) if (!ordered.includes(name)) ordered.push(name);
  CATEGORIES = [t("all_cats"), ...ordered];
}

async function loadCities() { CITIES = await api("/api/cities"); }
async function loadReviews() { REVIEWS = await api("/api/reviews"); }

async function loadCart() {
  if (!USER_ID) return;
  cartData = await api(`/api/cart?user_id=${USER_ID}`);
}

async function loadOrders() {
  if (!USER_ID) return;
  ORDER_HISTORY = await api(`/api/orders?user_id=${USER_ID}`);
}

async function loadProfile() {
  if (!USER_ID) return;
  const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const qs = new URLSearchParams({
    user_id: USER_ID,
    first_name: tgUser.first_name || "",
    username: tgUser.username || "",
  });
  try { PROFILE = await api(`/api/profile?${qs.toString()}`); }
  catch (e) { PROFILE = null; }
}

let state = { tab: "home", catFilter: t("all_cats"), query: "", checkoutStep: null, delivery: null, city: null, loading: true, topupStep: null, topupAmount: "", topupMethod: null, adminOpen: false, adminTab: "products", adminEditing: null, promoCode: "", appliedPromo: null };

async function addToCart(id) {
  if (!USER_ID) { alert("Откройте магазин через кнопку бота в Telegram, чтобы оформлять заказы."); return; }
  cartData = await api("/api/cart", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: USER_ID, product_id: id, action: "add" }),
  });
  render();
}

async function removeFromCart(id) {
  cartData = await api("/api/cart", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: USER_ID, product_id: id, action: "remove" }),
  });
  render();
}

function cartQtyFor(id) {
  const item = cartData.items.find(i => i.product_id === id);
  return item ? item.qty : 0;
}

function cartCount() { return cartData.items.reduce((a, i) => a + i.qty, 0); }

function starsSvg() {
  return '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>';
}

function stockPill(inStock) {
  return `<div class="stock-pill ${inStock ? "in" : "out"}"><span class="dot"></span>${inStock ? t("in_stock_pill") : t("out_of_stock_pill")}</div>`;
}

function badges(p) {
  const list = [];
  if (p.is_hit) list.push("HIT");
  return list.map(b => `<span class="badge ${b.toLowerCase()}">${b}</span>`).join("");
}

function productCard(p) {
  const qty = cartQtyFor(p.id);
  const placeholder = `<div style="height:180px;border-radius:16px;background:${gradFor(p.id)};display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
      <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.15),transparent 60%);"></div>
      <span style="font-size:44px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4));">🧴</span>
    </div>`;
  const photoBlock = p.photo
    ? `<img src="${p.photo}" style="width:100%;height:180px;object-fit:cover;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,0.3);" onerror="this.outerHTML=${JSON.stringify(placeholder).replace(/"/g, "&quot;")};">`
    : placeholder;
  return `
    <div class="card" style="margin:0 20px 20px;overflow:hidden;">
      <div style="padding:16px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;">
        <div style="display:flex;gap:6px;">${badges(p)}</div>
        <div style="width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;">♡</div>
      </div>
      <div style="padding:12px 16px 0;">${photoBlock}</div>
      <div style="padding:12px 16px 16px;">
        <div style="font-weight:700;font-size:17px;margin-bottom:6px;">${p.name}</div>
        ${p.description ? `<div style="color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:10px;">${p.description}</div>` : ""}
        <div style="margin-bottom:12px;">${stockPill(p.stock)}</div>
        <div style="color:#e879f9;font-size:22px;font-weight:800;margin-bottom:12px;">${p.price}€</div>
        ${p.stock ? `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <button class="btn btn-primary" onclick="addToCart(${p.id})">${qty > 0 ? `Добавлено · ${qty}` : "Добавить"}</button>
            <button class="btn btn-green" onclick="addToCart(${p.id});setTab('cart')">${t("buy_now")}</button>
          </div>
        ` : `<button class="btn btn-outline" disabled>${t("out_of_stock")}</button>`}

  `;
}

async function submitTopup() {
  // ВАЖНО: сервер сейчас зачисляет баланс сразу же (см. /api/topup в server.js) — это заглушка для теста.
  // Перед реальным запуском подключите настоящий приём платежей (Monobank Acquiring, LiqPay, ЮKassa и т.п.)
  // и зачисляйте баланс только после подтверждения оплаты от платёжной системы (по вебхуку), а не здесь.
  try {
    const res = await api("/api/topup", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: USER_ID, amount: Number(state.topupAmount), method: state.topupMethod }),
    });
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    alert(`✅ Баланс пополнен на ${state.topupAmount}€. Текущий баланс: ${res.balance}€`);
    state.topupStep = null; state.topupAmount = ""; state.topupMethod = null;
    await loadProfile();
    render();
  } catch (e) {
    alert("Не удалось пополнить баланс. Попробуйте снова.");
  }
}

// ─────────────────── admin panel ───────────────────
// Все данные админки (товары/заказы/промокоды/статистика/рефералы) теперь читаются
// и сохраняются через реальный API вашего сервера (/api/admin/...), а не только в браузере.
// Доступ защищён кодом администратора (ADMIN_CODE на сервере, по умолчанию 0000) —
// для боевого использования замените на проверку telegram user id (profile.is_admin).

let ADMIN_CODE = null;   // код, введённый администратором — используется в заголовке x-admin-code
let ADMIN_PROMOS = [];
let ADMIN_REFERRALS = [];
let ADMIN_ORDERS = [];
let ADMIN_CATEGORIES = [];
let ADMIN_CITIES = [];
let ADMIN_STATS = { revenueByDay: [0,0,0,0,0,0,0], ordersByDay: [0,0,0,0,0,0,0], labels: ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"], totalRevenue: 0, totalOrders: 0, avgCheck: 0 };

async function adminApi(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts && opts.headers), "x-admin-code": ADMIN_CODE },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Ошибка сервера");
  return res.json();
}

async function openAdminGate() {
  if (state.adminOpen) { closeAdmin(); return; }
  const pin = prompt("Код администратора:");
  if (pin === null) return;
  try {
    const check = await api("/api/admin/verify", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: pin }),
    });
    if (!check.ok) { alert("Неверный код администратора"); return; }
  } catch (e) {
    alert("Не удалось связаться с сервером. Убедитесь, что backend запущен.");
    return;
  }
  ADMIN_CODE = pin;
  state.adminOpen = true;
  state.adminTab = "products";
  state.adminEditing = null;
  document.getElementById("adminOverlay").style.display = "flex";
  await setAdminTab("products");
}

function closeAdmin() {
  state.adminOpen = false;
  document.getElementById("adminOverlay").style.display = "none";
}

async function setAdminTab(id) {
  state.adminTab = id;
  state.adminEditing = null;
  renderAdmin(true);
  try {
    if (id === "products") { await loadCatalog(); ADMIN_CATEGORIES = await adminApi("/api/admin/categories"); }
    if (id === "categories") ADMIN_CATEGORIES = await adminApi("/api/admin/categories");
    if (id === "cities") ADMIN_CITIES = await adminApi("/api/admin/cities");
    if (id === "orders") ADMIN_ORDERS = await adminApi("/api/admin/orders");
    if (id === "promo") ADMIN_PROMOS = await adminApi("/api/admin/promo");
    if (id === "stats") ADMIN_STATS = await adminApi("/api/admin/stats");
    if (id === "referral") ADMIN_REFERRALS = await adminApi("/api/admin/referrals");
  } catch (e) {
    console.error(e);
  }
  renderAdmin();
}

    if (state.adminTab === "cities") content = adminCitiesScreen();
    if (state.adminTab === "orders") content = adminOrdersScreen();
    if (state.adminTab === "stats") content = adminStatsScreen();
    if (state.adminTab === "promo") content = adminPromoScreen();

async function adminPhotoSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  // мгновенный локальный превью, пока идёт загрузка на сервер
  const localPreview = URL.createObjectURL(file);
  state.adminEditing.photo = localPreview;
  renderAdmin();
  const statusEl = document.getElementById("photoUploadStatus");
  if (statusEl) statusEl.textContent = "Загрузка фото…";
  try {
    const formData = new FormData();
    formData.append("photo", file);
    const res = await fetch("/api/admin/upload", { method: "POST", headers: { "x-admin-code": ADMIN_CODE }, body: formData });
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || "Ошибка загрузки");
    const data = await res.json();
    state.adminEditing.photo = data.url;
    renderAdmin();
  } catch (err) {
    alert("Не удалось загрузить фото: " + err.message);
  }
}

async function adminSaveProduct() {
  const p = state.adminEditing;
  if (!p.name || !p.price) { alert("Укажите название и цену"); return; }
  const payload = { ...p, price: Number(p.price) };
  try {
    if (p.isNew) await adminApi("/api/admin/products", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    else await adminApi(`/api/admin/products/${p.id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    await loadCatalog();
    state.adminEditing = null;
    renderAdmin();
  } catch (e) {
    alert("Не получилось сохранить: " + e.message);
  }
}

// Список названий для <select> в карточке товара. Если у товара стоит
// категория, которой больше нет в справочнике, она всё равно показывается,
// чтобы редактирование не затирало её молча.
function categoryOptions(current) {
  const names = ADMIN_CATEGORIES.map(c => c.name);
  if (current && !names.includes(current)) names.push(current);
  return names.map(n =>
    `<option value="${escapeAttr(n)}" style="background:#18101f;" ${n === current ? "selected" : ""}>${n}</option>`
  ).join("");
}

function escapeAttr(v) {
  return String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// Категории и города устроены одинаково, поэтому экран общий.
function dictScreen({ items, addFn, delFn, addLabel, emptyText, hint }) {
  return `

      <button class="btn btn-primary" style="margin-bottom:8px;" onclick="${addFn}()">${addLabel}</button>
      <div style="font-size:12.5px;color:rgba(255,255,255,0.4);margin-bottom:16px;line-height:1.45;">${hint}</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${items.map(it => `
          <div class="card" style="display:flex;align-items:center;gap:12px;padding:14px 16px;">
            <div style="flex:1;font-weight:600;font-size:15px;">${it.name}</div>
            <button onclick="${delFn}(${it.id})" style="width:34px;height:34px;border-radius:10px;background:rgba(248,113,113,0.15);border:none;color:#f87171;flex-shrink:0;">🗑</button>
          </div>
        `).join("") || `<div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px 0;">${emptyText}</div>`}
      </div>
    </div>
  `;
}

async function adminAddDictItem(kind, promptText) {
  const name = prompt(promptText);
  if (name === null) return;
  if (!name.trim()) { alert("Название не может быть пустым"); return; }
  try {
    await adminApi(`/api/admin/${kind}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim() }),
    });
    await reloadDict(kind);
    renderAdmin();
  } catch (e) { alert("Не удалось добавить: " + e.message); }
}

async function adminDeleteDictItem(kind, id, confirmText) {
  if (!confirm(confirmText)) return;
  try {
    await adminApi(`/api/admin/${kind}/${id}`, { method: "DELETE" });
    await reloadDict(kind);
    renderAdmin();
  } catch (e) { alert("Ошибка: " + e.message); }
}

async function reloadDict(kind) {
  if (kind === "categories") ADMIN_CATEGORIES = await adminApi("/api/admin/categories");
  if (kind === "cities") {
    ADMIN_CITIES = await adminApi("/api/admin/cities");
    CITIES = ADMIN_CITIES;   // чтобы витрина сразу увидела изменения
  }
}

async function adminAddPromo() {
  const code = prompt("Код промокода (например SUMMER15):");
  if (!code) return;
  const discount = Number(prompt("Скидка в %, например 10:"));
  if (!discount || discount <= 0) { alert("Некорректная скидка"); return; }
  try {
    await adminApi("/api/admin/promo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, discount }) });
    ADMIN_PROMOS = await adminApi("/api/admin/promo");
    renderAdmin();
  } catch (e) { alert("Не удалось добавить промокод: " + e.message); }
}
async function adminTogglePromo(id) {
  try {
    await adminApi(`/api/admin/promo/${id}`, { method: "PATCH" });
    ADMIN_PROMOS = await adminApi("/api/admin/promo");
    renderAdmin();
  } catch (e) { alert("Ошибка: " + e.message); }
}
async function adminDeletePromo(id) {
  try {
    await adminApi(`/api/admin/promo/${id}`, { method: "DELETE" });
    ADMIN_PROMOS = ADMIN_PROMOS.filter(p => p.id !== id);
    renderAdmin();
  } catch (e) { alert("Ошибка: " + e.message); }
}

// ─────────────────── tabbar ───────────────────

const TABS = [
  { id: "home", label: "Главная", icon: "🏠" },
  { id: "catalog", label: "Товары", icon: "🛍" },
  { id: "cart", label: "Корзина", icon: "🛒" },
  { id: "profile", label: "Профиль", icon: "👤" },
  { id: "history", label: "История", icon: "📦" },
];

function renderTabbar() {
  document.getElementById("tabbar").innerHTML = TABS.map(tab => `
    <button class="tab ${state.tab === tab.id ? "active" : ""}" onclick="haptic('light');setTab('${tab.id}')">
      <span class="icon-wrap" style="font-size:19px;">
        ${tab.icon}
        ${tab.id === "cart" && cartCount() > 0 ? `<span class="cart-badge">${cartCount()}</span>` : ""}
      </span>
      <span>${t(tab.id)}</span>
    </button>
  `).join("");
}

// ─────────────────── ring background (кольца) ───────────────────

function renderRings() {
  const el = document.getElementById("ringsBg");
  let html = '<div class="glow"></div>';
  for (let r = 1; r <= 6; r++) {
    const size = r * 90;
    html += `<div class="ring" style="width:${size}px;height:${size}px;"></div>`;
  }
  el.innerHTML = html;
}

// ─────────────────── skeleton при первой загрузке ───────────────────

function showSkeleton() {
  const screen = document.getElementById("screen");
  screen.innerHTML = `
    <div style="padding:20px;">
      <div class="skeleton-block" style="width:132px;height:132px;border-radius:28px;margin:0 auto 24px;"></div>
      <div class="skeleton-block" style="height:120px;margin-bottom:20px;"></div>
      <div class="skeleton-block" style="height:52px;margin-bottom:24px;"></div>
      <div class="skeleton-block" style="height:90px;margin-bottom:16px;"></div>
      <div class="skeleton-block" style="height:90px;"></div>
    </div>
  `;
}

// ─────────────────── actions ───────────────────

async function setTab(id) {
  state.tab = id;
  state.checkoutStep = null;
  if (id === "cart") await loadCart();
  if (id === "profile") await loadProfile();
  if (id === "history") await loadOrders();
  render();
}

async function applyPromo() {
  const code = (state.promoCode || "").trim();
  if (!code) return;
  try {
    const res = await api(`/api/promo/check?code=${encodeURIComponent(code)}`);
    if (!res.valid) {
      state.appliedPromo = null;
      alert("Такого промокода нет или он больше не активен");
    } else {
      state.appliedPromo = { code: res.code, discount: res.discount };
      if (tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    }
    render();
  } catch (e) {
    alert("Не удалось проверить промокод");
  }
}

async function submitCheckout() {
  try {
    const res = await api("/api/checkout", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: USER_ID, delivery_method: state.delivery, city: state.city, promo_code: state.appliedPromo ? state.appliedPromo.code : null }),
    });
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    alert(`✅ Заказ №${res.order_id} оформлен на сумму ${res.total}€`);
    state.checkoutStep = null; state.delivery = null; state.city = null; state.promoCode = ""; state.appliedPromo = null;
    await loadCart();
    setTab("history");
  } catch (e) {
    alert("Не получилось оформить заказ. Проверьте наличие товаров и попробуйте снова.");
  }
}

// ─────────────────── render ───────────────────

function render() {
  const screen = document.getElementById("screen");
  const scrollPos = screen.scrollTop;
  if (state.tab === "home") screen.innerHTML = renderHome();
  if (state.tab === "catalog") screen.innerHTML = renderCatalog();
  if (state.tab === "cart") screen.innerHTML = renderCart();
  if (state.tab === "profile") screen.innerHTML = renderProfile();
  if (state.tab === "history") screen.innerHTML = renderHistory();
  renderTabbar();
  screen.scrollTop = (state._preserveScroll ? scrollPos : 0);
  state._preserveScroll = false;
}

function renderScreenPreserveFocus(inputId) {
  state._preserveScroll = true;
  render();
  const el = document.getElementById(inputId);
  if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
}


// ─────────────────── старт ───────────────────

async function registerReferralIfNeeded() {
  // Если приложение открыто по реферальной ссылке (?startapp=ref_<id> в самой ссылке на бота),
  // Telegram передаёт этот параметр в initDataUnsafe.start_param — регистрируем приглашение.
  const startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (!USER_ID || !startParam || !startParam.startsWith("ref_")) return;
  const inviterId = startParam.slice(4);
  if (!inviterId || inviterId === String(USER_ID)) return;
  try {
    await api("/api/referral/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ inviter_id: inviterId, user_id: USER_ID }),
    });
  } catch (e) { /* не критично, просто не засчитаем приглашение */ }
}

async function boot() {
  renderRings();
  showSkeleton();
  try {
    await Promise.all([loadCatalog(), loadCities(), loadReviews(), loadCart(), loadProfile()]);
    await registerReferralIfNeeded();
  } catch (e) {
    console.error("Не удалось загрузить данные с сервера:", e);
  }
  render();
}
boot();

// ─────────────────── PWA & Offline Support ───────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(err => console.error('SW error:', err));
  });
}
const offlineBanner = document.getElementById('offline-banner');
function updateOnlineStatus() {
  if (offlineBanner) offlineBanner.style.display = navigator.onLine ? 'none' : 'block';
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
updateLangBtn();


// подгон темы под тему Telegram-клиента пользователя (если открыто внутри Telegram)
if (tg && tg.themeParams) {
  if (tg.setHeaderColor) tg.setHeaderColor("#111116");
  if (tg.setBackgroundColor) tg.setBackgroundColor("#060309");
}
</script>
